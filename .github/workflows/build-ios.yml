name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_PATH: BLEScanner.xcodeproj
  SCHEME: BLEScanner
  APP_NAME: BLEScanner

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Verify project
      run: |
        xcodebuild -version
        test -f "$PROJECT_PATH/xcshareddata/xcschemes/$SCHEME.xcscheme"
        xcodebuild -list -project "$PROJECT_PATH"

    - name: Build iOS Simulator (compile check)
      run: |
        set -o pipefail
        xcodebuild \
          -project "$PROJECT_PATH" \
          -scheme "$SCHEME" \
          -sdk iphonesimulator \
          -configuration Debug \
          -derivedDataPath DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          ENABLE_PREVIEWS=NO \
          ONLY_ACTIVE_ARCH=NO \
          build 2>&1 | tee build-simulator.log

    - name: Archive for iOS Device
      run: |
        set -o pipefail
        xcodebuild archive \
          -project "$PROJECT_PATH" \
          -scheme "$SCHEME" \
          -sdk iphoneos \
          -configuration Release \
          -archivePath "build/$APP_NAME.xcarchive" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          ENABLE_PREVIEWS=NO \
          ONLY_ACTIVE_ARCH=NO \
          2>&1 | tee build-archive.log

    - name: Package and validate IPA
      run: |
        set -euo pipefail

        APP_PATH="build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
        if [ ! -d "$APP_PATH" ]; then
          echo "App bundle not found at: $APP_PATH"
          find build -name "*.app" -type d
          exit 1
        fi

        EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP_PATH/Info.plist")
        echo "CFBundleExecutable: $EXEC_NAME"
        test -f "$APP_PATH/$EXEC_NAME"

        # Clean metadata that can break sideload tools on Windows
        xattr -cr "$APP_PATH"
        find "$APP_PATH" -name ".DS_Store" -delete
        find "$APP_PATH" -type l -delete
        chmod +x "$APP_PATH/$EXEC_NAME"

        # Remove broken signature folder from unsigned build, then ad-hoc sign
        rm -rf "$APP_PATH/_CodeSignature"
        codesign --force --sign - --deep --timestamp=none "$APP_PATH"
        codesign -vv "$APP_PATH"

        rm -rf Payload "$APP_NAME.ipa" "$APP_NAME-app.zip"
        mkdir -p Payload
        ditto --norsrc --noextattr "$APP_PATH" "Payload/$APP_NAME.app"

        # Validate bundle structure (file vs directory)
        while IFS= read -r -d '' entry; do
          if [ -L "$entry" ]; then
            echo "Symlink not allowed in bundle: $entry"
            exit 1
          fi
        done < <(find "Payload/$APP_NAME.app" -print0)

        # Standard IPA: Payload/App.app
        (cd Payload && zip -qr "../$APP_NAME.ipa" .)
        (cd Payload && zip -qr "../$APP_NAME-app.zip" "$APP_NAME.app")

        echo "=== IPA contents ==="
        unzip -l "$APP_NAME.ipa" | head -30

        IPA_SIZE=$(stat -f%z "$APP_NAME.ipa" 2>/dev/null || stat -c%s "$APP_NAME.ipa")
        echo "IPA size: $IPA_SIZE bytes"
        test "$IPA_SIZE" -gt 100000

        echo "IPA packaging OK"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BLEScanner-IPA
        path: BLEScanner.ipa
        retention-days: 7

    - name: Upload APP bundle (for i4 tools)
      uses: actions/upload-artifact@v4
      with:
        name: BLEScanner-APP
        path: BLEScanner-app.zip
        retention-days: 7

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build-simulator.log
          build-archive.log
        retention-days: 3
