name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_PATH: BLEScanner.xcodeproj
  SCHEME: BLEScanner
  APP_NAME: BLEScanner

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Verify project
      run: |
        xcodebuild -version
        test -f "$PROJECT_PATH/xcshareddata/xcschemes/$SCHEME.xcscheme"
        xcodebuild -list -project "$PROJECT_PATH"

    - name: Build iOS Simulator (compile check)
      run: |
        set -o pipefail
        xcodebuild \
          -project "$PROJECT_PATH" \
          -scheme "$SCHEME" \
          -sdk iphonesimulator \
          -configuration Debug \
          -derivedDataPath DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          ENABLE_PREVIEWS=NO \
          ONLY_ACTIVE_ARCH=NO \
          build 2>&1 | tee build-simulator.log

    - name: Archive for iOS Device
      run: |
        set -o pipefail
        xcodebuild archive \
          -project "$PROJECT_PATH" \
          -scheme "$SCHEME" \
          -sdk iphoneos \
          -configuration Release \
          -archivePath "build/$APP_NAME.xcarchive" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          ENABLE_PREVIEWS=NO \
          ONLY_ACTIVE_ARCH=NO \
          2>&1 | tee build-archive.log

    - name: Package and validate IPA
      run: |
        set -euo pipefail

        APP_PATH="build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
        if [ ! -d "$APP_PATH" ]; then
          echo "App bundle not found at: $APP_PATH"
          find build -name "*.app" -type d
          exit 1
        fi

        echo "=== App bundle contents ==="
        ls -la "$APP_PATH"

        if [ ! -f "$APP_PATH/Info.plist" ]; then
          echo "Missing Info.plist"
          exit 1
        fi

        EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP_PATH/Info.plist")
        echo "CFBundleExecutable: $EXEC_NAME"

        if [ ! -f "$APP_PATH/$EXEC_NAME" ]; then
          echo "Missing executable: $APP_PATH/$EXEC_NAME"
          exit 1
        fi

        file "$APP_PATH/$EXEC_NAME"
        file "$APP_PATH/$EXEC_NAME" | grep -q "arm64" || {
          echo "Executable is not arm64 device binary"
          exit 1
        }

        rm -rf Payload "$APP_NAME.ipa"
        mkdir -p Payload
        ditto "$APP_PATH" "Payload/$APP_NAME.app"

        # Standard IPA layout: Payload/App.app
        (cd Payload && zip -qr "../$APP_NAME.ipa" .)

        echo "=== IPA contents ==="
        unzip -l "$APP_NAME.ipa" | head -30

        IPA_SIZE=$(stat -f%z "$APP_NAME.ipa" 2>/dev/null || stat -c%s "$APP_NAME.ipa")
        echo "IPA size: $IPA_SIZE bytes"
        if [ "$IPA_SIZE" -lt 100000 ]; then
          echo "IPA too small, likely invalid"
          exit 1
        fi

        echo "IPA packaging OK"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BLEScanner-IPA
        path: BLEScanner.ipa
        retention-days: 7

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build-simulator.log
          build-archive.log
        retention-days: 3
