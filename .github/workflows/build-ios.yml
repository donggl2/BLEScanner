name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_PATH: BLEScanner.xcodeproj
  SCHEME: BLEScanner

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Verify project
      run: |
        xcodebuild -version
        test -f "$PROJECT_PATH/xcshareddata/xcschemes/$SCHEME.xcscheme"
        xcodebuild -list -project "$PROJECT_PATH"

    - name: Build iOS Simulator
      run: |
        set -o pipefail
        xcodebuild \
          -project "$PROJECT_PATH" \
          -scheme "$SCHEME" \
          -sdk iphonesimulator \
          -configuration Debug \
          -derivedDataPath DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          ENABLE_PREVIEWS=NO \
          ONLY_ACTIVE_ARCH=NO \
          build 2>&1 | tee build-simulator.log || {
            echo "=== BUILD ERRORS ==="
            grep -E "error:|warning:.*error|failed" build-simulator.log | tail -80
            exit 1
          }

    - name: Build iOS Device
      run: |
        set -o pipefail
        xcodebuild \
          -project "$PROJECT_PATH" \
          -scheme "$SCHEME" \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          ENABLE_PREVIEWS=NO \
          ONLY_ACTIVE_ARCH=NO \
          build 2>&1 | tee build-device.log || {
            echo "=== BUILD ERRORS ==="
            grep -E "error:|warning:.*error|failed" build-device.log | tail -80
            exit 1
          }

    - name: Package IPA
      run: |
        APP_PATH=$(find DerivedData -path "*Release-iphoneos/*.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          find DerivedData -name "*.app" -type d
          exit 1
        fi
        mkdir -p Payload && cp -r "$APP_PATH" Payload/
        zip -r BLEScanner.ipa Payload
        ls -lh BLEScanner.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: BLEScanner-IPA
        path: BLEScanner.ipa
        retention-days: 7

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build-simulator.log
          build-device.log
        retention-days: 3
