name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  # 允许使用 Node.js 20（临时解决警告）
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'
        
    - name: Show Xcode Version
      run: |
        xcode-select -p
        xcodebuild -version
        
    - name: List Project Info
      run: |
        cd BLEScanner
        echo "=== Project Structure ==="
        ls -la
        echo ""
        echo "=== Available Schemes ==="
        xcodebuild -list -project BLEScanner.xcodeproj 2>/dev/null || echo "无法列出 schemes"
        echo ""
        echo "=== Available SDKs ==="
        xcodebuild -showsdks
        
    - name: Build for iOS Simulator
      run: |
        cd BLEScanner
        set -o pipefail
        
        # 使用 SDK 参数而非 destination，避免设备不可用问题
        xcodebuild \
          -project BLEScanner.xcodeproj \
          -scheme BLEScanner \
          -sdk iphonesimulator \
          -configuration Debug \
          -derivedDataPath build \
          clean build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO \
          | tee build.log
          
        if [ $? -ne 0 ]; then
          echo "? Debug build failed"
          tail -100 build.log
          exit 1
        fi
        
        echo "? Debug build succeeded"
        
    - name: Build for Device
      run: |
        cd BLEScanner
        set -o pipefail
        
        # 构建 Release 版本（真机架构）
        xcodebuild \
          -project BLEScanner.xcodeproj \
          -scheme BLEScanner \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          ONLY_ACTIVE_ARCH=NO \
          | tee build-release.log
          
        if [ $? -ne 0 ]; then
          echo "? Release build failed"
          tail -100 build-release.log
          exit 1
        fi
        
        echo "? Release build succeeded"
        
    - name: Find and Package .app to .ipa
      run: |
        cd BLEScanner
        
        # 查找 .app 文件（可能在不同路径）
        APP_PATH=$(find build -name "*.app" -type d | head -n 1)
        
        if [ -z "$APP_PATH" ]; then
          echo "? 未找到 .app 文件，检查目录结构："
          find build -type d -name "*.app" 2>/dev/null
          ls -la build/
          exit 1
        fi
        
        echo "? 找到应用: $APP_PATH"
        
        # 显示应用信息
        echo "? 应用内容："
        ls -la "$APP_PATH"
        
        # 创建 Payload 目录
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        
        # 打包成 ipa
        zip -r BLEScanner.ipa Payload
        
        # 验证 IPA
        ls -lh BLEScanner.ipa
        
        echo "? 成功生成 BLEScanner.ipa"
        
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BLEScanner-IPA
        path: BLEScanner/BLEScanner.ipa
        retention-days: 7
        
    - name: Summary
      run: |
        echo "=========================================="
        echo "? BLE Scanner iOS Build Complete!"
        echo "=========================================="
        echo ""
        echo "? 下载步骤："
        echo "1. 打开 GitHub 仓库页面"
        echo "2. 点击 Actions 标签"
        echo "3. 选择最新的 workflow run"
        echo "4. 在 Artifacts 部分下载 BLEScanner-IPA"
        echo ""
        echo "??  注意：此 IPA 未签名，安装前需要使用："
        echo "   - AltStore (推荐，Windows/Mac 可用)"
        echo "   - SideStore (iOS 直接安装)"
        echo "   - Xcode"
        echo "=========================================="
