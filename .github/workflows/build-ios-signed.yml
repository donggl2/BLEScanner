name: Build Signed iOS App (需要 Apple 开发者账号)

# ?? 此 workflow 需要配置 GitHub Secrets 才能使用
# 适合有付费 Apple Developer 账号 ($99/年) 的用户

on:
  workflow_dispatch:  # 仅手动触发
    inputs:
      signing_method:
        description: '签名方式'
        required: true
        default: 'ad-hoc'
        type: choice
        options:
          - ad-hoc      # 用于测试设备安装
          - app-store   # 用于 App Store 上传

jobs:
  build-signed:
    runs-on: macos-14
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
        
    # ==========================================
    # 配置签名（需要提前设置 GitHub Secrets）
    # ==========================================
    # 需要的 Secrets:
    # - BUILD_CERTIFICATE_BASE64: 证书文件 base64 编码
    # - P12_PASSWORD: 证书密码
    # - BUILD_PROVISION_PROFILE_BASE64: 描述文件 base64 编码
    # - KEYCHAIN_PASSWORD: 临时钥匙串密码（任意）
    # ==========================================
    
    - name: Install the Apple certificate and provisioning profile
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # 创建临时钥匙串
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -l build.keychain
        
        # 导入证书
        echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
        security import certificate.p12 -k build.keychain -P $P12_PASSWORD -T /usr/bin/codesign || true
        security set-key-partition-list -S apple-tool:,apple: -s -k $KEYCHAIN_PASSWORD build.keychain || true
        
        # 安装描述文件
        echo $BUILD_PROVISION_PROFILE_BASE64 | base64 --decode > BLEScanner.mobileprovision
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp BLEScanner.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
        
    - name: Build Signed IPA
      run: |
        xcodebuild \
          -project BLEScanner.xcodeproj \
          -scheme BLEScanner \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          -derivedDataPath build \
          clean build \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="iPhone Distribution" \
          PROVISIONING_PROFILE_SPECIFIER="BLEScanner Distribution" \
          DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM_ID }}"
          
    - name: Archive and Export IPA
      run: |
        xcodebuild \
          -project BLEScanner.xcodeproj \
          -scheme BLEScanner \
          -destination 'generic/platform=iOS' \
          -archivePath build/BLEScanner.xcarchive \
          archive \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="iPhone Distribution" \
          PROVISIONING_PROFILE_SPECIFIER="BLEScanner Distribution"
          
        # 导出 IPA
        cat > exportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${{ secrets.DEVELOPMENT_TEAM_ID }}</string>
            <key>uploadSymbols</key>
            <false/>
        </dict>
        </plist>
        EOF
        
        xcodebuild \
          -exportArchive \
          -archivePath build/BLEScanner.xcarchive \
          -exportPath build/export \
          -exportOptionsPlist exportOptions.plist
          
        mv build/export/*.ipa BLEScanner-Signed.ipa
        
    - name: Upload Signed IPA
      uses: actions/upload-artifact@v4
      with:
        name: BLEScanner-Signed-IPA
        path: BLEScanner-Signed.ipa
        retention-days: 30
        
    - name: Cleanup
      if: always()
      run: |
        security delete-keychain build.keychain || true
